<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>

<body>
    <section class="page">
        <main class="hero" id="hero">
            <div class="hero__text">
                <h2 class="hero__subtitle">It’s play time.</h2>
                <h1 class="hero__title">Ready to play?</h1>
            </div>
            <button class="hero__button" id="hero-button"><img class="hero__button-img"
                    src="./src/assets/icons/stadia_controller.svg" alt="">Play<img class="hero__button-arrow"
                    src="./src/assets/icons/Arrow 1.svg" alt=""></button>
            <img class="hero__img" src="./src/assets/img/stadia_controller.svg" alt="">
        </main>
    </section>
    <section class="settings d-none" id="settings">
        <div class="settings__container">
            <div class="settings__header">
                <h2 class="settings__title">Settings</h2>
                <img class="settings__title-line" src="./src/assets/img/Line 3(1).svg" alt="">
            </div>
            <div class="settings__content">
                <div class="settings__options">
                    <div class="settings__section settings__section--theme">
                        <h3 class="settings__subtitle"><img class="settings__icon" src="./src/assets/icons/palette.svg"
                                alt="">Game
                            themes</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><label class="settings__label"><input type="radio"
                                        name="theme">Code vibes theme<img class="settings__line"
                                        src="./src/assets/img/Line 3.svg" alt=""></label>
                            </li>
                            <li class="settings__item"><label class="settings__label"><input type="radio"
                                        name="theme">Gaming theme<img class="settings__line"
                                        src="./src/assets/img/Line 3.svg" alt=""></label></li>
                        </ul>
                    </div>
                    <div class="settings__section settings__section--player">
                        <h3 class="settings__subtitle"><img class="settings__icon"
                                src="./src/assets/icons/chess_pawn.svg" alt="">Choose player</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><label class="settings__label"><input type="radio"
                                        name="player">Blue<img class="settings__line" src="./src/assets/img/Line 3.svg"
                                        alt=""></label></li>
                            <li class="settings__item"><label class="settings__label"><input type="radio"
                                        name="player">Orange<img class="settings__line"
                                        src="./src/assets/img/Line 3.svg" alt=""></label></li>
                        </ul>
                    </div>
                    <div class="settings__section">
                        <h3 class="settings__subtitle"><img class="settings__icon" src="./src/assets/icons/style.svg"
                                alt="">Board
                            size</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><label class="settings__label"><input type="radio" name="size">16
                                    cards<img class="settings__line" src="./src/assets/img/Line 3.svg" alt=""></label>
                            </li>
                            <li class="settings__item"><label class="settings__label"><input type="radio" name="size">24
                                    cards<img class="settings__line" src="./src/assets/img/Line 3.svg" alt=""></label>
                            </li>
                            <li class="settings__item"><label class="settings__label"><input type="radio" name="size">36
                                    cards<img class="settings__line" src="./src/assets/img/Line 3.svg" alt=""></label>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="settings__preview">
                    <img class="settings__preview-image" src="./src/assets/img/Theme Visual(1).svg" alt="">
                    <div class="settings__summary">
                        <p class="settings__summary-label">Theme</p>
                        <div class="settings__summary-line-wrapper">
                            <img class="settings__summary-line settings__summary-line--theme"
                                src="./src/assets/img/Line 6.svg" alt="">
                        </div>
                        <p class="settings__summary-label">Player</p>
                        <div class="settings__summary-line-wrapper">
                            <img class="settings__summary-line settings__summary-line--player"
                                src="./src/assets/img/Line 6.svg" alt="">
                        </div>
                        <p class="settings__summary-label">Board size</p>
                        <button class="settings__start-button settings__start-button--inactive"
                            id="settings-start-button"><img class="settings__start-icon"
                                src="./src/assets/icons/smart_display.svg" alt="">Start</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="game d-none" id="game">
        <div class="game__header">
            <div class="game__players">
                <div class="game__player">
                    <img class="game__player-icon" src="./src/assets/icons/label.svg" alt="">
                    <p class="game__player-name-blue">Blue</p>
                    <p class="game__player-points-blue">0</p>
                </div>
                <div class="game__player">
                    <img class="game__player-icon" src="./src/assets/icons/label(1).svg" alt="">
                    <p class="game__player-name-orange">Orange</p>
                    <p class="game__player-points-orange">0</p>
                </div>
            </div>
            <div class="game__current-player">
                <p class="game__current-player-label">Current player:</p>
                <img class="game__current-player-icon" id="game-current-player-icon" src="./src/assets/icons/label.svg"
                    alt="">
            </div>
            <button class="game__exit-button" id="game-exit-button"><img src="./src/assets/icons/move_item.svg"
                    alt="">Exit game</button>
        </div>
        <div class="game__cards">
        </div>
    </section>
    <div class="popup d-none" id="popup">
        <div class="popup__window" id="popup-window">
            <p class="popup__text">Are you sure you want to quit the game?</p>
            <div class="popup__buttons">
                <button class="popup__button popup__button--back" id="popup-back-button">Back to game</button>
                <button class="popup__button popup__button--exit" id="popup-exit-button">Exit game</button>
            </div>
        </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
