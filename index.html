<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>

<body>
    <div class="page">
        <main class="hero">
            <div class="hero__text">
                <h2 class="hero__subtitle">It’s play time.</h2>
                <h1 class="hero__title">Ready to play?</h1>
            </div>
            <button class="hero__button"><img src="./src/assets/icons/stadia_controller.svg" alt="">Play<img
                    src="./src/assets/icons/Arrow 1.svg" alt=""></button>
        </main>
    </div>
    <footer>

    </footer>
    <div class="settings">
        <div class="settings__container">
            <h2 class="settings__title">Settings</h2>
            <div class="settings__content">
                <div class="settings__options">
                    <div class="settings__section">
                        <h3 class="settings__subtitle"><img class="settings__icon" src="./src/assets/icons/palette.svg"
                                alt="">Game
                            themes</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><input type="radio" name="theme">Code vibes theme</li>
                            <li class="settings__item"><input type="radio" name="theme">Gaming theme</li>
                            <li class="settings__item"><input type="radio" name="theme">DA Projects theme</li>
                            <li class="settings__item"><input type="radio" name="theme">Foods theme</li>
                        </ul>
                    </div>
                    <div class="settings__section">
                        <h3 class="settings__subtitle"><img class="settings__icon"
                                src="./src/assets/icons/chess_pawn.svg" alt="">Choose player</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><input type="radio" name="player">Blue</li>
                            <li class="settings__item"><input type="radio" name="player">Orange</li>
                        </ul>
                    </div>
                    <div class="settings__section">
                        <h3 class="settings__subtitle"><img class="settings__icon" src="./src/assets/icons/style.svg"
                                alt="">Board
                            size</h3>
                        <ul class="settings__list">
                            <li class="settings__item"><input type="radio" name="size">16 cards</li>
                            <li class="settings__item"><input type="radio" name="size">24 cards</li>
                            <li class="settings__item"><input type="radio" name="size">36 cards</li>
                        </ul>
                    </div>
                </div>
                <div class="settings__preview">
                    <img class="settings__preview-image" src="./src/assets/img/Theme Visual(1).svg" alt="">
                    <div class="settings__summary">
                        <p class="settings__summary-label">Theme</p>
                        <img class="settings__summary-line" src="./src/assets/img/Line 6.svg" alt="">
                        <p class="settings__summary-label">Player</p>
                        <img class="settings__summary-line" src="./src/assets/img/Line 6.svg" alt="">
                        <p class="settings__summary-label">Board size</p>
                        <button class="settings__start-button"><img class="settings__start-icon"
                                src="./src/assets/icons/smart_display.svg" alt="">Start</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="game">
        <div class="game__header">
            <div class="game__players">
                <div class="game__player">
                    <img class="game__player-icon" src="./src/assets/icons/label.svg" alt="">
                    <p class="game__player-name-blue">Blue</p>
                    <p class="game__player-points-blue">0</p>
                </div>
                <div class="game__player">
                    <img class="game__player-icon" src="./src/assets/icons/label(1).svg" alt="">
                    <p class="game__player-name-orange">Orange</p>
                    <p class="game__player-points-orange">0</p>
                </div>
            </div>
            <div class="game__current-player">
                <p class="game__current-player-label">Current player:</p>
                <img class="game__current-player-icon" src="./src/assets/icons/label.svg" alt="">
            </div>
            <button class="game__exit-button"><img src="./src/assets/icons/move_item.svg" alt="">Exit game</button>
        </div>
        <div class="game__cards">
        </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
